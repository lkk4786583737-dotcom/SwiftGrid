name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m py_compile engine.py storage.py swiftgrid/backend/main.py

      - name: Run offline modeling tests
        run: |
          python -m unittest discover -s tests -p "test_modeling_multi_agent_*.py" -v
          python -m unittest tests/test_engine_guardrail.py -v

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build deployment image
        run: docker build --tag swiftgrid:ci .

      - name: Smoke-test deployment image
        run: |
          docker run --detach --name swiftgrid-ci -p 8000:8000 \
            -e SWIFTGRID_ALLOW_RUNTIME_CONFIG=false \
            swiftgrid:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs swiftgrid-ci
          exit 1
