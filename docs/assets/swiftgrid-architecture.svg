<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">表速通：样例学习与新表复用</title>
<desc id="desc">Next.js 通过 REST 与 SSE 连接 FastAPI。首次学习由模型生成代码，本地执行完整数据并校验目标，成功后保存。后续数据先直接执行保存逻辑，报错才尝试模型修复并回放学习目标。字段与少量样例可能发送模型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172c25}.h{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5d7068}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#52665d}.wire{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style>
<rect width="1200" height="790" rx="24" fill="#f5f8f6"/>
<text x="36" y="48" class="h">SwiftGrid · 后端与 LLM 处理流程</text>
<text x="36" y="76" class="sub">模型提出规则 → 本地程序验收 → 保存逻辑 → 新周期复用</text>
<rect x="36" y="102" width="330" height="72" rx="13" fill="#fff" stroke="#c8dacf"/>
<text x="57" y="132" class="label">Next.js · 用户界面</text><text x="57" y="156" class="small">上传 / 预览 / 学习 / 逻辑库 / 结果</text>
<path d="M366 138H510" class="wire"/><text x="387" y="126" class="small">REST + SSE</text>
<rect x="514" y="102" width="650" height="72" rx="13" fill="#fff" stroke="#c8dacf"/>
<text x="536" y="132" class="label">FastAPI · API 与任务编排</text><text x="536" y="156" class="small">文件解析 · 内存句柄 · 后台线程 · 进度事件 · 结果导出</text>
<rect x="36" y="198" width="1128" height="240" rx="16" fill="#edf7f0" stroke="#c8e2d1"/>
<text x="57" y="230" class="label">01  首次学习</text><text x="201" y="230" class="small">源工作簿 + 完整目标样例</text>
<rect x="58" y="260" width="224" height="84" rx="12" fill="#fff" stroke="#c7dbcf"/>
<text x="76" y="293" class="label">组织模型上下文</text><text x="76" y="320" class="small">字段 / 少量样例 / 公式 / 澄清</text>
<path d="M282 302H314" class="wire"/>
<rect x="318" y="260" width="224" height="84" rx="12" fill="#e8edff" stroke="#c5cff4"/>
<text x="337" y="293" class="label">LLM · 生成处理代码</text><text x="337" y="320" class="small">process_data(source_dfs)</text>
<path d="M542 302H575" class="wire"/>
<rect x="579" y="260" width="278" height="84" rx="12" fill="#fff" stroke="#85bc99"/>
<text x="598" y="293" class="label">本地执行与目标校验</text><text x="598" y="320" class="small">AST 护栏 / 全量源数据 / 完整目标</text>
<path d="M857 302H893" class="wire"/>
<rect x="897" y="260" width="244" height="84" rx="12" fill="#09894b"/>
<text x="917" y="293" style="fill:#fff" class="label">通过 → 用户保存</text><text x="917" y="320" style="fill:#e3f5e9" class="small">代码 / 结构画像 / 学习数据</text>
<path d="M718 344V376H430V347" class="wire dash"/><text x="464" y="400" class="small">真实错误 / 差异反馈 · 默认最多 3 次尝试</text>
<text x="58" y="416" class="small">仍未通过：诊断差异，向用户澄清业务规则</text>
<rect x="36" y="458" width="1128" height="235" rx="16" fill="#fff" stroke="#c8dacf"/>
<text x="57" y="491" class="label">02  新期复用</text><text x="201" y="491" class="small">正常执行路径无需再次调用模型</text>
<rect x="58" y="516" width="224" height="76" rx="12" fill="#f1f6f3" stroke="#c7dbcf"/>
<text x="76" y="548" class="label">新数据 + 已保存逻辑</text><text x="76" y="573" class="small">按学习画像对齐工作表结构</text>
<path d="M282 554H314" class="wire"/>
<rect x="318" y="516" width="224" height="76" rx="12" fill="#edf7f0" stroke="#85bc99"/>
<text x="337" y="548" class="label">本地执行已保存代码</text><text x="337" y="573" class="small">直接运行 · 无需重新学习</text>
<path d="M542 554H575" class="wire"/>
<rect x="579" y="516" width="278" height="76" rx="12" fill="#edf7f0" stroke="#85bc99"/>
<text x="598" y="548" class="label">结果检查与分析</text><text x="598" y="573" class="small">预览 / 处理报告 / 基础统计 / 图表</text>
<path d="M857 554H893" class="wire"/>
<rect x="897" y="516" width="244" height="76" rx="12" fill="#f1f6f3" stroke="#c7dbcf"/>
<text x="917" y="548" class="label">下载交付物</text><text x="917" y="573" class="small">Excel / PNG / SVG / JPG</text>
<path d="M430 592V620H575" class="wire dash"/>
<rect x="579" y="608" width="562" height="60" rx="11" fill="#fff7e8" stroke="#e5d4ac"/>
<text x="598" y="633" class="small">仅执行报错时：LLM 修复 → 回放学习目标 → 再执行新表</text><text x="598" y="654" class="small">有限轮尝试；仍失败则返回错误</text>
<text x="58" y="666" class="small">复用成功 ≠ 任意业务口径均正确</text>
<text x="36" y="730" class="small">数据边界：全量计算在本地；字段、样例、公式与错误摘要仍可能发送模型。</text>
<text x="36" y="757" class="small">当前主流程：样例学习与复用。智能制表、多 Agent 与企业知识底座单列为探索 / 规划。</text>
</svg>
